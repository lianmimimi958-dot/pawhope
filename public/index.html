<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="爪印日记" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>爪印日记</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <main class="page-scroll" id="appViewport"></main>

    <nav class="tabbar" id="bottomTabbar">
      <button class="tab-btn active" data-tab="home">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>
        <span>首页</span>
      </button>
      <button class="tab-btn" data-tab="device">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z M12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/></svg>
        <span>设备</span>
      </button>
      <button class="tab-btn tab-center" data-tab="social" aria-label="萌圈">
        <span class="center-dot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg></span>
        <span>萌圈</span>
      </button>
      <button class="tab-btn" data-tab="mall">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 12H6.2z M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span>商城</span>
      </button>
      <button class="tab-btn" data-tab="mine">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 20c1-3.6 3.9-5.6 7.5-5.6s6.5 2 7.5 5.6"/></svg>
        <span>我的</span>
      </button>
    </nav>

    <div class="sheet-mask hidden" id="drawerBackdrop">
      <div class="sheet-panel" id="drawerSheet"></div>
    </div>

    <div class="toast-tip hidden" id="craftToast"></div>
  </div>

  <script src="/security-sdk.js"></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
