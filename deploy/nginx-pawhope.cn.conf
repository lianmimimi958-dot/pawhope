# 宝塔：网站 → pawhope.cn → 配置文件，把内容换成下面这份（证书路径按面板自动生成的改）
# 或：网站 → 添加站点 → 反向代理到 http://127.0.0.1:3680 后，再申请 SSL

upstream pawhope_app {
    server 127.0.0.1:3680;
    keepalive 16;
}

server {
    listen 80;
    server_name pawhope.cn www.pawhope.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pawhope.cn www.pawhope.cn;

    # 宝塔申请证书后一般是这两个路径，以你面板里显示的为准：
    ssl_certificate     /www/server/panel/vhost/cert/pawhope.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pawhope.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://pawhope_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
